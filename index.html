<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  
  <!-- Web App / PWA Setup per Schermo Intero su Smartphone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#dc0a2d">

  <style>
    :root {
      --pokedex-red: #dc0a2d;
      --pokedex-dark-red: #8b0000;
      --screen-bg: #232323;
      --screen-screen: #8bac0f;
      --screen-text: #0f380f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* Struttura Esterna Pokédex Rosso */
    .pokedex {
      background-color: var(--pokedex-red);
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      border: 4px solid #500000;
    }

    /* Modulo Sensore / Luce Blu superiore */
    .pokedex-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 3px solid var(--pokedex-dark-red);
      padding-bottom: 10px;
    }

    .camera-lens {
      width: 45px;
      height: 45px;
      background: radial-gradient(circle at 30% 30%, #85d7ff, #1c72ac);
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .led-lights {
      display: flex;
      gap: 8px;
    }

    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #333;
    }

    .led-red { background-color: #ff0000; }
    .led-yellow { background-color: #ffcc00; }
    .led-green { background-color: #00cc00; }

    /* Schermo Verde Retrò */
    .screen-container {
      background-color: #dedede;
      padding: 15px;
      border-radius: 12px;
      border: 3px solid #666;
    }

    .screen {
      background-color: #dedede;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pokemon-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      image-rendering: pixelated;
      margin-bottom: 10px;
    }

    .pokemon-name {
      text-transform: capitalize;
      font-size: 1.4rem;
      font-weight: bold;
      color: #333;
    }

    .pokemon-id {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 5px;
    }

    .types-container {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .type-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      color: white;
      text-transform: uppercase;
      background-color: #666;
    }

    /* Punti di Controllo e Ricerca */
    .controls {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      display: flex;
      gap: 5px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #500000;
      outline: none;
      font-size: 1rem;
    }

    button {
      padding: 10px 15px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:active {
      background-color: #555;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      background-color: #2b2b2b;
      padding: 12px;
      font-size: 1rem;
      box-shadow: 0 4px #000;
    }

    .btn-nav:active {
      box-shadow: 0 1px #000;
      transform: translateY(3px);
    }

    .btn-audio {
      background-color: #ffcc00;
      color: #333;
      width: 100%;
      box-shadow: 0 4px #b38f00;
    }

    .btn-audio:active {
      box-shadow: 0 1px #b38f00;
      transform: translateY(3px);
    }

    .loading, .error {
      font-size: 1rem;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="pokedex">
    <!-- Header estitico Pokédex -->
    <div class="pokedex-header">
      <div class="camera-lens"></div>
      <div class="led-lights">
        <div class="led led-red"></div>
        <div class="led led-yellow"></div>
        <div class="led led-green"></div>
      </div>
    </div>

    <!-- Schermo Principale -->
    <div class="screen-container">
      <div class="screen" id="screen">
        <div class="loading">Inizializzazione Pokédex...</div>
      </div>
    </div>

    <!-- Controlli -->
    <div class="controls">
      <div class="search-box">
        <input type="text" id="pokemon-input" placeholder="Nome o Numero (es. 25)...">
        <button id="search-btn">Cerca</button>
      </div>

      <button class="btn-audio" id="audio-btn">🔊 Ascolta Verso</button>

      <div class="nav-buttons">
        <button class="btn-nav" id="prev-btn">◀ Precedente</button>
        <button class="btn-nav" id="next-btn">Successivo ▶</button>
      </div>
    </div>
  </div>

  <script>
    let currentPokemonId = 1;
    let currentAudioUrl = '';

    const screen = document.getElementById('screen');
    const input = document.getElementById('pokemon-input');
    const searchBtn = document.getElementById('search-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const audioBtn = document.getElementById('audio-btn');

    // Mappa colori per i Tipi
    const typeColors = {
      fire: '#EE8130', grass: '#7AC74C', water: '#6390F0',
      bug: '#A6B91A', normal: '#A8A878', poison: '#A040A0',
      electric: '#F7D02C', ground: '#E2BF65', fairy: '#D685AD',
      fighting: '#C22E28', psychic: '#F95587', rock: '#B6A136',
      ghost: '#70559B', ice: '#96D9D6', dragon: '#6F35FC'
    };

    // Funzione principale per caricare i dati da PokéAPI
    async function loadPokemon(query) {
      screen.innerHTML = `<div class="loading">Ricerca in corso...</div>`;
      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${String(query).toLowerCase()}`);
        if (!response.ok) throw new Error("Pokémon non trovato");

        const data = await response.json();
        currentPokemonId = data.id;

        // Imposta l'URL dell'audio (verso ufficiale)
        currentAudioUrl = data.cries.latest || data.cries.legacy || '';

        // Costruisci le etichette per i tipi
        const typesHtml = data.types.map(t => {
          const color = typeColors[t.type.name] || '#666';
          return `<span class="type-badge" style="background-color: ${color}">${t.type.name}</span>`;
        }).join('');

        // Immagine sprite ad alta definizione
        const sprite = data.sprites.other['official-artwork'].front_default || data.sprites.front_default;

        // Renderizza lo schermo
        screen.innerHTML = `
          <div class="pokemon-id">N° ${String(data.id).padStart(3, '0')}</div>
          <img class="pokemon-img" src="${sprite}" alt="${data.name}">
          <div class="pokemon-name">${data.name}</div>
          <div class="types-container">${typesHtml}</div>
        `;
      } catch (err) {
        screen.innerHTML = `<div class="error">❌ Nessun Pokémon trovato</div>`;
      }
    }

    // Riproduzione Audio
    function playCry() {
      if (currentAudioUrl) {
        const audio = new Audio(currentAudioUrl);
        audio.play().catch(e => console.log("Riproduzione interrotta dall'utente"));
      }
    }

    // Event Listener per Pulsanti e Input
    searchBtn.addEventListener('click', () => {
      if (input.value.trim() !== '') {
        loadPokemon(input.value.trim());
        input.value = '';
      }
    });

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && input.value.trim() !== '') {
        loadPokemon(input.value.trim());
        input.value = '';
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentPokemonId > 1) {
        loadPokemon(currentPokemonId - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      loadPokemon(currentPokemonId + 1);
    });

    audioBtn.addEventListener('click', playCry);

    // Caricamento Iniziale (Bulbasaur #1)
    loadPokemon(1);
  </script>
</body>
</html>
